<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stack Overflown - Um Jogo de Quebra-Cabeça com Tema de Dev</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-container">
      <div class="main-panel">
        <div>
          <h1>🧱 Estouro de pilha</h1>
          <div class="subtitle">Combine os padrões de erro antes de você estourar!</div>
        </div>
        <canvas id="gameCanvas" width="300" height="600"></canvas>
      </div>

      <div class="side-panel">
        <div class="info-section">
          <h3>Pontuação</h3>
          <div class="score" id="score">0</div>
          <div class="status" id="status">Jogando...</div>
        </div>

        <div class="info-section">
          <h3>Padrão Alvo</h3>
          <div class="pattern-preview">
            <canvas id="patternCanvas" width="100" height="100"></canvas>
            <div class="pattern-name" id="patternName">Carregando...</div>
          </div>
        </div>

        <div class="info-section">
          <h3>Controles</h3>
          <div class="controls">
            <strong>←/→</strong> Movimentar<br />
            <strong>↑</strong> Rotação<br />
            <strong>↓</strong> Queda Suave<br />
            <strong>Espaço</strong> Queda Brusca<br />
            <strong>P</strong> Parar
          </div>
        </div>
      </div>
    </div>

    <div class="game-over" id="gameOver">
      <h2>PILHA TRANSBORDOU!</h2>
      <p>Sua pilha chegou ao teto</p>
      <p>Pontuação Final: <span id="finalScore">0</span></p>
      <button onclick="location.reload()">Reiniciar</button>
    </div>

    <script src="patterns.js"></script>
    <script src="index.js"></script>
  </body>
</html>
